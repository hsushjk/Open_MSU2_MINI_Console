name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  test:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-optional.txt

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff pyflakes

      - name: unit tests
        run: python -m unittest discover -s tests

      - name: static checks
        run: python -X utf8 tools/lint.py

  windows:
    name: windows-${{ matrix.arch }}-${{ matrix.mode }}
    runs-on: windows-latest
    timeout-minutes: 30
    needs: test
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        mode: [console, noconsole]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.10" "pynput>=1.7.6" "pywin32>=306"
          if ("${{ matrix.arch }}" -eq "x64") { python -m pip install "numpy>=1.26" }
          python -c "import serial, PIL, psutil; print('deps ok')"

      - name: build
        shell: pwsh
        run: |
          $name = "MSU2_Console-windows-${{ matrix.arch }}-${{ matrix.mode }}"
          $flags = @("tools/build_exe.py", "--mode", "${{ matrix.mode }}", "--name", $name,
                     "--dist", "dist", "--work", "build")
          if ("${{ matrix.arch }}" -eq "x86") { $flags += "--no-numpy" }
          python @flags

      - name: smoke test
        if: matrix.mode == 'console'
        shell: pwsh
        run: |
          $exe = "dist\MSU2_Console-windows-${{ matrix.arch }}-${{ matrix.mode }}.exe"
          $ver = (& $exe --version 2>&1 | Out-String)
          Write-Host $ver
          if ($ver -notmatch "MSU2_MINI") { throw "版本输出异常" }
          $plugins = (& $exe --plugins 2>&1 | Out-String)
          Write-Host $plugins
          if ($plugins -notmatch "clock") { throw "插件列表输出异常" }

      - uses: actions/upload-artifact@v4
        with:
          name: MSU2_Console-windows-${{ matrix.arch }}-${{ matrix.mode }}
          path: dist/MSU2_Console-windows-${{ matrix.arch }}-${{ matrix.mode }}.exe
          if-no-files-found: error

  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.10" "numpy>=1.26"

      - name: build
        run: |
          python tools/build_exe.py --mode console \
            --name MSU2_Console-linux-${{ matrix.arch }} --dist dist --work build

      - name: smoke test
        run: |
          exe="dist/MSU2_Console-linux-${{ matrix.arch }}"
          chmod +x "$exe"
          "$exe" --version
          out=$("$exe" --plugins 2>&1 || true)
          echo "$out" | tail -n 20
          echo "$out" | grep -q clock

      - uses: actions/upload-artifact@v4
        with:
          name: MSU2_Console-linux-${{ matrix.arch }}
          path: dist/MSU2_Console-linux-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [windows, linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: check version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python3 -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          host=$(python3 -c "import re,pathlib;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"',pathlib.Path('msu2_mini.py').read_text()).group(1))")
          echo "tag=$tag pyproject=$py host=$host"
          test "$tag" = "$py"
          test "$tag" = "$host"

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: collect files
        run: |
          mkdir -p uploads
          find dist -type f -name "*.exe" -exec cp {} uploads/ \;
          find dist -type f -name "MSU2_Console-linux-*" -exec cp {} uploads/ \;
          ls -l uploads

      - uses: softprops/action-gh-release@v2
        with:
          files: uploads/*
          generate_release_notes: true