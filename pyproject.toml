[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-msu2-mini-console"
version = "1.0.9"
description = "MSU2_MINI 小屏上位机（Open_MSU2_MINI_Console）"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "hsushjk" }]
keywords = ["msu2", "msu2-mini", "ch32x033", "lcd", "serial", "widgets"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Topic :: Terminals :: Serial",
]
dependencies = [
  "pyserial>=3.5",
  "pillow>=9.0.0",
  "psutil>=5.9.0",
]

[project.optional-dependencies]
extras = ["pynput>=1.7.6", "numpy>=1.21.0"]
full = ["pynput>=1.7.6", "numpy>=1.21.0", "pywin32>=306; sys_platform == 'win32'"]

[project.urls]
Homepage = "https://github.com/hsushjk/Open_MSU2_MINI_Console"
Upstream = "https://github.com/hsushjk/MSU2_MINI_Console"
Firmware = "https://github.com/hsushjk/Open_MSU2_MINI"

[project.scripts]
msu2-console = "msu2_mini:main"

[tool.setuptools]
py-modules = ["msu2_mini"]
packages = ["msu2_core", "widgets"]
include-package-data = true

[tool.setuptools.package-data]
msu2_core = ["assets/fonts/*.otf", "assets/fonts/OFL.txt"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.py[cod]"]